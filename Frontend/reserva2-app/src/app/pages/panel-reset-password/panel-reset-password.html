<div class="auth-page">
  <div class="auth-card">
    @if (!completado()) {
      <h1>Elegí una nueva contraseña</h1>
      <p class="sub">Ingresá tu nueva contraseña para el panel de Reserva2.</p>

      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" [(ngModel)]="nuevaPassword" placeholder="••••••••">
      </div>
      <div class="field">
        <label>Repetí la contraseña</label>
        <input type="password" [(ngModel)]="confirmarPassword" placeholder="••••••••">
      </div>

      @if (error()) { <div class="error-msg">{{ error() }}</div> }

      <button class="btn-naranja btn-full" [disabled]="enviando()" (click)="guardar()">
        {{ enviando() ? 'Guardando...' : 'Guardar nueva contraseña' }}
      </button>
    } @else {
      <h1>¡Listo!</h1>
      <p class="sub">Tu contraseña se actualizó correctamente.</p>
      <button class="btn-naranja btn-full" (click)="irALogin()">Ir a ingresar</button>
    }
  </div>
</div>
